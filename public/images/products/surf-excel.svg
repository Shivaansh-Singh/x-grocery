<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FC"/>
      <stop offset="100%" stop-color="#DCE6F7"/>
    </linearGradient>
    <linearGradient id="surfBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055B8"/>
      <stop offset="100%" stop-color="#003B82"/>
    </linearGradient>
    <linearGradient id="surfPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6007E"/>
      <stop offset="100%" stop-color="#B30062"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001B48" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)"/>

  <!-- Surf Excel Detergent Pouch Packaging -->
  <g filter="url(#shadow)">
    <!-- Detergent Pouch Shape -->
    <path d="M120 70 L380 70 L400 420 L100 420 Z" fill="url(#surfBlue)"/>
    
    <!-- Top Sealed Header Strip -->
    <rect x="115" y="70" width="270" height="30" fill="#00306B" opacity="0.6"/>
    
    <!-- Stain Burst Splatter Graphic (Pink/Orange Multi-point Starburst) -->
    <path d="M250 150 L262 180 L295 168 L278 198 L310 210 L280 230 L305 255 L272 260 L280 295 L250 275 L220 295 L228 260 L195 255 L220 230 L190 210 L222 198 L205 168 L238 180 Z" fill="url(#surfPink)"/>
    
    <!-- Yellow Stain Splatter Center -->
    <circle cx="250" cy="230" r="30" fill="#FFC800"/>

    <!-- Surf Excel Brand Typography -->
    <text x="250" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" font-style="italic" letter-spacing="-1">Surf excel</text>
    
    <!-- Easy Wash Banner Badge -->
    <rect x="140" y="335" width="220" height="36" rx="18" fill="#FF8A00"/>
    <text x="250" y="359" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EASY WASH</text>
    
    <!-- Detergent Powder Subtext -->
    <text x="250" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#D0E2FF" text-anchor="middle">DETERGENT POWDER • 500g</text>

    <!-- Detergent Bubbles Effect -->
    <circle cx="140" cy="130" r="14" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="165" cy="110" r="8" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="360" cy="140" r="18" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="330" cy="115" r="10" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
