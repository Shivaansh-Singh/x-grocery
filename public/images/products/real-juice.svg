<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EC"/>
      <stop offset="100%" stop-color="#FFE8D6"/>
    </linearGradient>
    <linearGradient id="cartonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B23"/>
      <stop offset="100%" stop-color="#9E0B11"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A0000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)"/>

  <!-- Real Fruit Power Tetra Pak Carton -->
  <g filter="url(#shadow)">
    <!-- Main Carton Box -->
    <rect x="150" y="90" width="200" height="340" rx="16" fill="url(#cartonGrad)"/>
    
    <!-- Top Slanted Sealed Header -->
    <polygon points="150,90 250,50 350,90" fill="#B50E15"/>
    <circle cx="250" cy="72" r="16" fill="#008837"/>

    <!-- Green Leaf Banner Header -->
    <path d="M150 140 Q250 165 350 140 L350 90 L150 90 Z" fill="#008837"/>

    <!-- Real Brand Name Badge -->
    <ellipse cx="250" cy="180" rx="75" ry="38" fill="#FFFFFF"/>
    <text x="250" y="190" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#E21B23" text-anchor="middle" font-style="italic">Réal</text>
    <text x="250" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#008837" text-anchor="middle" letter-spacing="1.5">FRUIT POWER</text>

    <!-- Mixed Fruit Graphic Banner -->
    <rect x="165" y="235" width="170" height="115" rx="12" fill="#FFA500"/>
    <circle cx="210" cy="275" r="28" fill="#E21B23"/> <!-- Apple -->
    <circle cx="265" cy="280" r="32" fill="#FF7700"/> <!-- Orange -->
    <circle cx="240" cy="310" r="24" fill="#FFC800"/> <!-- Mango -->

    <!-- Product Description Banner -->
    <text x="250" y="378" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MIXED FRUIT</text>
    <text x="250" y="398" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#FFC800" text-anchor="middle">100% JUICE CONTENT • 1 LITER</text>
  </g>
</svg>
